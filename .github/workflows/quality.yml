# Checks every push and pull request. On a student branch toolkit/<name-tag> it also checks that
# only toolkits/<name-tag>-*/ changed and, once a folder has files, that each changed toolkit loads (an empty
# branch pushed only to claim its name passes). A failing run marks the commit with
# a red cross on GitHub; it does not stop the push (see lab/docs/GITHUB-ACCESS.md for the rules that do).
name: quality
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest --run
      - run: npx vite build

  student-scope:
    name: Student branch changes only its toolkit
    if: github.event_name == 'push' && startsWith(github.ref_name, 'toolkit/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Branch toolkit/<name-tag> (one per student, e.g. toolkit/u123-hk) may change only
      # toolkits/<name-tag>-*/ (e.g. toolkits/u123-hk-house/). An older branch toolkit/<toolkit-name>
      # (e.g. toolkit/u123-hk-house) still works: its own folder counts too.
      - name: Only the student's toolkit folders changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="${BRANCH#toolkit/}"
          if ! printf '%s' "$tag" | grep -Eq '^[a-z][a-z0-9_-]*$'; then
            echo "::error::Branch toolkit/$tag: the name must be lowercase letters, digits, - or _, starting with a letter."
            exit 1
          fi
          base="$(git merge-base origin/main HEAD)"
          outside="$(git diff --name-only "$base" HEAD | grep -Ev "^toolkits/($tag|$tag-[a-z0-9_-]+)/" || true)"
          if [ -n "$outside" ]; then
            echo "::error::This branch changes files outside toolkits/$tag-.../. Undo these changes:"
            printf '%s\n' "$outside"
            exit 1
          fi
          echo "OK: only toolkits/$tag-.../ changed."
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Check every toolkit folder this branch changed. None changed yet (a branch just started with
      # its empty first commit): nothing to check, stays green.
      - name: Check the toolkits
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          ids="$(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD | sed -n 's#^toolkits/\([^/]*\)/.*#\1#p' | sort -u)"
          if [ -z "$ids" ]; then
            echo "No toolkit folder changed on this branch yet: nothing to check."
            exit 0
          fi
          for id in $ids; do
            if [ ! -d "toolkits/$id" ]; then echo "toolkits/$id was deleted: skipped."; continue; fi
            npm run check:toolkit -- -t "$id"
          done
