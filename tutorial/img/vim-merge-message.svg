<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="Vim opened for a merge message: lines start with ~; type :wq and press Enter" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
<title>Vim opened for a merge message: lines start with ~; type :wq and press Enter</title>
<rect x="0" y="0" width="700" height="300" rx="10" fill="#0c0c0c"/>
<text x="18" y="30" font-size="13.5" font-family="Consolas, Menlo, 'Cascadia Mono', monospace" fill="#e6e6e6">Merge branch 'main' into toolkit/<tspan fill="#ffb454">u123-hk-house</tspan></text>
<text x="18" y="52" font-size="12.5" font-family="Consolas, Menlo, 'Cascadia Mono', monospace" fill="#7f8c98"># Please enter a commit message to explain why this merge is necessary,</text>
<text x="18" y="70" font-size="12.5" font-family="Consolas, Menlo, 'Cascadia Mono', monospace" fill="#7f8c98"># especially if it merges an updated upstream into a topic branch.</text>
<text x="18" y="100" font-size="13.5" font-family="Consolas, Menlo, 'Cascadia Mono', monospace" fill="#4f6bed">~</text>
<text x="18" y="120" font-size="13.5" font-family="Consolas, Menlo, 'Cascadia Mono', monospace" fill="#4f6bed">~</text>
<text x="18" y="140" font-size="13.5" font-family="Consolas, Menlo, 'Cascadia Mono', monospace" fill="#4f6bed">~</text>
<text x="18" y="160" font-size="13.5" font-family="Consolas, Menlo, 'Cascadia Mono', monospace" fill="#4f6bed">~</text>
<text x="18" y="180" font-size="13.5" font-family="Consolas, Menlo, 'Cascadia Mono', monospace" fill="#4f6bed">~</text>
<text x="18" y="200" font-size="13.5" font-family="Consolas, Menlo, 'Cascadia Mono', monospace" fill="#4f6bed">~</text>
<text x="18" y="220" font-size="13.5" font-family="Consolas, Menlo, 'Cascadia Mono', monospace" fill="#4f6bed">~</text>
<text x="18" y="284" font-size="15" font-family="Consolas, Menlo, 'Cascadia Mono', monospace" fill="#ffffff" font-weight="700">:wq</text>
<rect x="52" y="271" width="9" height="17" rx="0" fill="#e6e6e6"/>
<rect x="11" y="265" width="56" height="28" rx="6" fill="none" stroke="#d6337a" stroke-width="2.5"/>
<circle cx="86" cy="279" r="11" fill="#d6337a" stroke="#fff" stroke-width="2"/><text x="86" y="283.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="682" y="284" font-size="13" fill="#ffb454" text-anchor="end">Esc, then :wq, then Enter</text>
</svg>
