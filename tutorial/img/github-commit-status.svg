<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="GitHub commit list: a green tick, a yellow dot while the check runs, and a red cross; the tick that counts is beside your latest commit" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
<title>GitHub commit list: a green tick, a yellow dot while the check runs, and a red cross; the tick that counts is beside your latest commit</title>
<rect x="0" y="0" width="760" height="250" rx="10" fill="#f6f8fa"/>
<text x="20" y="28" font-size="13" fill="#1f2328" font-weight="700">Commits on toolkit/…  (newest first)</text>
<rect x="20" y="40" width="720" height="52" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="36" y="62" font-size="13.5" fill="#1f2328" font-weight="600">feat(<tspan fill="#b25e00">u123-hk-house</tspan>): bed count analysis</text><text x="36" y="81" font-size="11.5" fill="#59636e">you committed · 2 minutes ago</text><circle cx="350.4" cy="58" r="8" fill="#1a7f37"/><text x="350.4" y="62.5" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">✓</text><text x="724" y="72" font-size="12" fill="#59636e" text-anchor="end">green ✓ = checks passed</text>
<rect x="20" y="98" width="720" height="52" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="36" y="120" font-size="13.5" fill="#1f2328" font-weight="600">feat(<tspan fill="#b25e00">u123-hk-house</tspan>): first version of my toolkit</text><text x="36" y="139" font-size="11.5" fill="#59636e">you committed · 2 minutes ago</text><circle cx="411.2" cy="116" r="8" fill="#cf222e"/><text x="411.2" y="120.5" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">✗</text><text x="724" y="130" font-size="12" fill="#59636e" text-anchor="end">red ✗ = click it › Details</text>
<rect x="20" y="156" width="720" height="52" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="36" y="178" font-size="13.5" fill="#1f2328" font-weight="600">chore(<tspan fill="#b25e00">u123-hk-house</tspan>): start my toolkit</text><text x="36" y="197" font-size="11.5" fill="#59636e">you committed · 2 minutes ago</text><circle cx="380.8" cy="174" r="8" fill="#1a7f37"/><text x="380.8" y="178.5" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">✓</text><text x="724" y="188" font-size="12" fill="#59636e" text-anchor="end">empty first commit: ✓, nothing to check</text>
<text x="20" y="236" font-size="12" fill="#1f2328">A yellow ● means the check is still running: wait a few minutes. Only the ✓ beside your LATEST commit counts.</text>
</svg>
