<path d="M12 214 q12 -14 24 0" fill="none" stroke="#e0e0e0" stroke-width="1.8"/>
<text x="24" y="242" font-size="17" fill="#858585" text-anchor="middle">⚙</text>
<rect x="6" y="182" width="36" height="38" rx="6" fill="none" stroke="#d6337a" stroke-width="2.5"/>
<circle cx="24" cy="164" r="11" fill="#d6337a" stroke="#fff" stroke-width="2"/><text x="24" y="168.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<rect x="56" y="150" width="300" height="76" rx="5" fill="#252526" stroke="#454545" stroke-width="1"/>
