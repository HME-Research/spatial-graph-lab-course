<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" role="img" aria-label="VS Code: the Accounts icon at the bottom of the left bar opens a menu with Sign in with GitHub" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
