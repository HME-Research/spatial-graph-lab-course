<text x="70" y="40" font-size="13" fill="#bbbbbb">Then sign in in your browser and allow VS Code.</text>
<text x="70" y="62" font-size="13" fill="#bbbbbb">Afterwards the Accounts menu shows your GitHub username.</text>
