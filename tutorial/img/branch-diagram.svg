<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="Branches: main is the course; your branch toolkit/&lt;toolkit-id&gt; starts with a claim commit; push sends it to GitHub, git pull origin main brings in course updates" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
<title>Branches: main is the course; your branch toolkit/&lt;toolkit-id&gt; starts with a claim commit; push sends it to GitHub, git pull origin main brings in course updates</title>
<defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#62625c"/></marker></defs>
<rect x="0" y="0" width="760" height="290" rx="10" fill="#f4f4f2"/>
<text x="20" y="34" font-size="14" fill="#2c5d8f" font-weight="700">main</text>
<text x="20" y="52" font-size="11.5" fill="#62625c">the course (read only for you)</text>
<line x1="200" y1="44" x2="720" y2="44" stroke="#2c5d8f" stroke-width="4"/>
<circle cx="220" cy="44" r="9" fill="#fff" stroke="#2c5d8f" stroke-width="4"/>
<circle cx="330" cy="44" r="9" fill="#fff" stroke="#2c5d8f" stroke-width="4"/>
<circle cx="560" cy="44" r="9" fill="#fff" stroke="#2c5d8f" stroke-width="4"/>
<text x="560" y="26" font-size="11.5" fill="#62625c" text-anchor="middle">course update</text>
<text x="20" y="150" font-size="14" fill="#2f5a2a" font-weight="700">toolkit/<tspan fill="#b25e00">&lt;toolkit-id&gt;</tspan></text>
<text x="20" y="168" font-size="11.5" fill="#62625c">your branch: only your folder</text>
<path d="M330 53 C 340 120, 360 140, 390 160" stroke="#2f7d32" stroke-width="4" fill="none"/>
<line x1="390" y1="160" x2="720" y2="160" stroke="#2f7d32" stroke-width="4"/>
<circle cx="400" cy="160" r="9" fill="#fff" stroke="#2f7d32" stroke-width="4" stroke-dasharray="3 2"/>
<text x="400" y="190" font-size="11.5" fill="#2f5a2a" text-anchor="middle">claim</text>
<text x="400" y="204" font-size="11" fill="#62625c" text-anchor="middle">(empty commit)</text>
<circle cx="480" cy="160" r="9" fill="#2f7d32"/>
<circle cx="540" cy="160" r="9" fill="#2f7d32"/>
<text x="510" y="190" font-size="11.5" fill="#2f5a2a" text-anchor="middle">your commits</text>
<path d="M560 53 C 575 110, 600 140, 620 152" stroke="#62625c" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a2)"/>
<circle cx="630" cy="160" r="9" fill="#fff" stroke="#2f7d32" stroke-width="4"/>
<text x="566" y="100" font-size="11.5" fill="#1f1f1d" text-anchor="end">course update:</text>
<text x="566" y="116" font-size="11.5" font-family="Consolas, Menlo, 'Cascadia Mono', monospace" fill="#1f1f1d" text-anchor="end">git pull --no-rebase</text>
<text x="566" y="132" font-size="11.5" font-family="Consolas, Menlo, 'Cascadia Mono', monospace" fill="#1f1f1d" text-anchor="end">--no-edit origin main</text>
<text x="630" y="190" font-size="11.5" fill="#2f5a2a" text-anchor="middle">merge</text>
<rect x="250" y="226" width="300" height="50" rx="8" fill="#ffffff" stroke="#c9c9c4" stroke-width="1"/>
<text x="400" y="248" font-size="13" fill="#1f1f1d" font-weight="700" text-anchor="middle">GitHub (course repository)</text>
<text x="400" y="266" font-size="11.5" fill="#62625c" text-anchor="middle">your tutor sees what you pushed</text>
<path d="M560 172 C 560 200, 540 215, 520 224" stroke="#d6337a" stroke-width="2.5" fill="none" marker-end="url(#a2)"/>
<text x="575" y="214" font-size="12" font-family="Consolas, Menlo, 'Cascadia Mono', monospace" fill="#d6337a">git push</text>
<path d="M300 224 C 280 205, 280 190, 300 175" stroke="#62625c" stroke-width="2" fill="none" marker-end="url(#a2)"/>
<text x="150" y="214" font-size="11.5" fill="#62625c">git pull (your own pushes</text>
<text x="150" y="228" font-size="11.5" fill="#62625c">from another computer)</text>
</svg>
