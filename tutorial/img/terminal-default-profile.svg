<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="VS Code terminal: the arrow next to + opens a menu with Select Default Profile; then choose Command Prompt" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
<title>VS Code terminal: the arrow next to + opens a menu with Select Default Profile; then choose Command Prompt</title>
<rect x="0" y="0" width="760" height="300" rx="10" fill="#f4f4f2"/>
<rect x="14" y="14" width="360" height="272" rx="8" fill="#1e1e1e"/>
<text x="28" y="38" font-size="11" fill="#e7e7e7" font-weight="700">TERMINAL</text>
<rect x="286" y="24" width="22" height="20" rx="3" fill="#3a3d41"/>
<text x="297" y="39" font-size="15" fill="#e0e0e0" text-anchor="middle">+</text>
<rect x="310" y="24" width="20" height="20" rx="3" fill="#505357"/>
<text x="320" y="38" font-size="12" fill="#fff" text-anchor="middle">▾</text>
<rect x="307" y="21" width="26" height="26" rx="6" fill="none" stroke="#d6337a" stroke-width="2.5"/>
<circle cx="350" cy="34" r="11" fill="#d6337a" stroke="#fff" stroke-width="2"/><text x="350" y="38.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<rect x="70" y="52" width="262" height="222" rx="5" fill="#252526" stroke="#454545" stroke-width="1"/>
<text x="84" y="76" font-size="13" fill="#cccccc">Command Prompt</text>
<text x="84" y="102" font-size="13" fill="#cccccc">PowerShell</text>
<text x="84" y="128" font-size="13" fill="#cccccc">Git Bash</text>
<line x1="76" y1="148" x2="326" y2="148" stroke="#454545"/>
<text x="84" y="170" font-size="13" fill="#cccccc">Split Terminal</text>
<text x="84" y="196" font-size="13" fill="#cccccc">Configure Terminal Settings</text>
<rect x="74" y="210" width="254" height="24" rx="4" fill="#0060c0"/>
<text x="84" y="227" font-size="13" fill="#fff">Select Default Profile</text>
<rect x="71" y="207" width="260" height="30" rx="6" fill="none" stroke="#d6337a" stroke-width="2.5"/>
<circle cx="52" cy="222" r="11" fill="#d6337a" stroke="#fff" stroke-width="2"/><text x="52" y="226.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="84" y="258" font-size="13" fill="#cccccc">Run Task…</text>
<path d="M384 150 h34" stroke="#62625c" stroke-width="2" marker-end="url(#ah)"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#62625c"/></marker></defs>
<rect x="430" y="40" width="316" height="190" rx="6" fill="#252526" stroke="#454545" stroke-width="1"/>
<rect x="442" y="52" width="292" height="26" rx="3" fill="#3c3c3c" stroke="#007fd4" stroke-width="1"/>
<text x="452" y="70" font-size="12.5" fill="#858585">Select your default terminal profile</text>
<rect x="438" y="88" width="300" height="26" rx="3" fill="#0060c0"/>
<text x="452" y="106" font-size="13" fill="#fff">Command Prompt</text>
<text x="726" y="106" font-size="11.5" fill="#dfe9f5" text-anchor="end">cmd.exe</text>
<rect x="435" y="85" width="306" height="32" rx="6" fill="none" stroke="#d6337a" stroke-width="2.5"/>
<circle cx="746" cy="101" r="11" fill="#d6337a" stroke="#fff" stroke-width="2"/><text x="746" y="105.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="452" y="136" font-size="13" fill="#cccccc">PowerShell</text>
<text x="452" y="164" font-size="13" fill="#cccccc">Git Bash</text>
<text x="452" y="192" font-size="13" fill="#cccccc">JavaScript Debug Terminal</text>
<text x="588" y="258" font-size="12.5" fill="#1f1f1d" text-anchor="middle">Then close the PowerShell terminal (bin icon)</text>
<text x="588" y="276" font-size="12.5" fill="#1f1f1d" text-anchor="middle">and open a new one: Terminal › New Terminal.</text>
</svg>
