<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The Welcome screen of Spatial Graph Lab: Create project, then Open project, Open toolkit design… and Upload toolkit (.zip), which is highlighted" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
<title>The Welcome screen of Spatial Graph Lab: Create project, then Open project, Open toolkit design… and Upload toolkit (.zip), which is highlighted</title>
<rect x="0" y="0" width="760" height="300" rx="10" fill="#f4f4f1"/>
<rect x="12" y="12" width="736" height="276" rx="10" fill="#ffffff" stroke="#d6d6cf" stroke-width="1"/>
<text x="32" y="46" font-size="20" fill="#1c1c1a" font-weight="700">Welcome to Spatial Graph Lab</text>
<rect x="664" y="26" width="64" height="30" rx="6" fill="#ffffff" stroke="#cfcfc8" stroke-width="1"/><text x="696" y="46" font-size="13" fill="#1c1c1a" text-anchor="middle">Guide</text>
<text x="32" y="70" font-size="13" fill="#5f5f5a">Design buildings as graphs of nodes and edges, then explore them as plans and in 3D.</text>
<rect x="32" y="84" width="696" height="62" rx="8" fill="#234a72"/>
<text x="50" y="110" font-size="15" fill="#ffffff" font-weight="700">Create project</text>
<text x="50" y="132" font-size="12.5" fill="#dfe8f2">Start from an empty graph</text>
<rect x="32" y="158" width="224" height="62" rx="8" fill="#ffffff" stroke="#d6d6cf" stroke-width="1"/>
<text x="48" y="184" font-size="14" fill="#1c1c1a" font-weight="600">Open project</text>
<text x="48" y="205" font-size="12" fill="#5f5f5a">A project file from your computer</text>
<rect x="268" y="158" width="224" height="62" rx="8" fill="#ffffff" stroke="#d6d6cf" stroke-width="1"/>
<text x="284" y="184" font-size="14" fill="#1c1c1a" font-weight="600">Open toolkit design…</text>
<text x="284" y="205" font-size="12" fill="#5f5f5a">The House or a toolkit's designs</text>
<rect x="504" y="158" width="224" height="62" rx="8" fill="#ffffff" stroke="#d6d6cf" stroke-width="1"/>
<text x="520" y="184" font-size="14" fill="#1c1c1a" font-weight="600">Upload toolkit (.zip)</text>
<text x="520" y="205" font-size="12" fill="#5f5f5a">The zip your AI chat gave you</text>
<rect x="500" y="154" width="232" height="70" rx="10" fill="none" stroke="#d6337a" stroke-width="2.5"/>
<circle cx="732" cy="154" r="11" fill="#d6337a" stroke="#fff" stroke-width="2"/><text x="732" y="158.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="32" y="252" font-size="13" fill="#1c1c1a" font-weight="700">Toolkit</text>
<rect x="88" y="238" width="150" height="22" rx="4" fill="#ffffff" stroke="#8a8a84" stroke-width="1"/><text x="96" y="254" font-size="12.5" fill="#1c1c1a">House</text><text x="226" y="254" font-size="11" fill="#5f5f5a" text-anchor="middle">▾</text>
<text x="32" y="278" font-size="12" fill="#5f5f5a">Its Functions, custom attributes and algorithms come with the new project.</text>
</svg>
