<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" role="img" aria-label="The Connect to GitHub window: choose Sign in with your browser" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
<title>The Connect to GitHub window: choose Sign in with your browser</title>
<rect x="0" y="0" width="520" height="330" rx="10" fill="#f4f4f2"/>
<rect x="60" y="14" width="400" height="302" rx="8" fill="#ffffff" stroke="#c9c9c4" stroke-width="1"/>
<rect x="60" y="14" width="400" height="32" rx="8" fill="#f3f3f3"/>
<rect x="60" y="34" width="400" height="12" rx="0" fill="#f3f3f3"/>
<text x="76" y="35" font-size="12.5" fill="#3b3b3b">Git Credential Manager</text>
<text x="446" y="35" font-size="13" fill="#3b3b3b" text-anchor="end">✕</text>
<circle cx="260" cy="94" r="26" fill="#24292f"/>
<text x="260" y="101" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">GH</text>
<text x="260" y="148" font-size="18" fill="#1f1f1d" font-weight="700" text-anchor="middle">Connect to GitHub</text>
<rect x="130" y="170" width="260" height="38" rx="6" fill="#2c974b"/>
<text x="260" y="194" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">Sign in with your browser</text>
<rect x="127" y="167" width="266" height="44" rx="6" fill="none" stroke="#d6337a" stroke-width="2.5"/>
<circle cx="412" cy="189" r="11" fill="#d6337a" stroke="#fff" stroke-width="2"/><text x="412" y="193.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="260" y="232" font-size="12" fill="#62625c" text-anchor="middle">or</text>
<text x="260" y="256" font-size="13" fill="#2c5d8f" text-anchor="middle">Sign in with a code</text>
<text x="260" y="296" font-size="12" fill="#62625c" text-anchor="middle">Then sign in in the browser and Authorize.</text>
</svg>
