<rect x="0" y="0" width="560" height="300" rx="10" fill="#f4f4f2"/>
<circle cx="280" cy="150" r="96" fill="none" stroke="#b9cbe0" stroke-width="3"/>
<path d="M322.1 63.7 A96 96 0 0 1 349.1 83.3" stroke="#2c5d8f" stroke-width="3" fill="none" marker-end="url(#a3)"/><rect x="210" y="30" width="140" height="32" rx="16" fill="#ffffff" stroke="#2c5d8f" stroke-width="2"/><text x="280" y="51" font-size="13" fill="#1f1f1d" font-weight="600" text-anchor="middle">1. Be on your branch</text>
