<path d="M296.7 244.5 A96 96 0 0 1 263.3 244.5" stroke="#2c5d8f" stroke-width="3" fill="none" marker-end="url(#a3)"/><rect x="301.69449935762583" y="218.13776741499453" width="140" height="32" rx="16" fill="#ffffff" stroke="#2c5d8f" stroke-width="2"/><text x="371.69449935762583" y="239.13776741499453" font-size="13" fill="#1f1f1d" font-weight="600" text-anchor="middle">3. Check (PASSED)</text>
<path d="M195.2 195.1 A96 96 0 0 1 184.9 163.4" stroke="#2c5d8f" stroke-width="3" fill="none" marker-end="url(#a3)"/><rect x="118.30550064237423" y="218.13776741499453" width="140" height="32" rx="16" fill="#ffffff" stroke="#2c5d8f" stroke-width="2"/><text x="188.30550064237423" y="239.13776741499453" font-size="13" fill="#1f1f1d" font-weight="600" text-anchor="middle">4. Commit</text>
<path d="M210.9 83.3 A96 96 0 0 1 237.9 63.7" stroke="#2c5d8f" stroke-width="3" fill="none" marker-end="url(#a3)"/><rect x="61.63518345795606" y="101.86223258500544" width="140" height="32" rx="16" fill="#ffffff" stroke="#2c5d8f" stroke-width="2"/><text x="131.63518345795606" y="122.86223258500544" font-size="13" fill="#1f1f1d" font-weight="600" text-anchor="middle">5. Push</text>
<text x="280" y="146" font-size="13" fill="#62625c" text-anchor="middle">every</text>
<text x="280" y="164" font-size="13" fill="#62625c" text-anchor="middle">session</text>
