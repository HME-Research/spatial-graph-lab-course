<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="The loop of every working session: be on your branch, change, check, commit, push, and again" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
<title>The loop of every working session: be on your branch, change, check, commit, push, and again</title>
