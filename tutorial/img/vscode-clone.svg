<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="VS Code with no folder open: the Source Control icon in the left bar, the Clone Repository button, and the box at the top with the repository address pasted in" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
